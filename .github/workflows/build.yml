name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android:
    name: Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Report API target
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::warning::VITE_API_URL is not set, so the APK falls back to same-origin requests and cannot reach the ClipMine API. Add the secret under Settings > Secrets and variables > Actions."
          else
            echo "Building against the VITE_API_URL secret."
          fi

      - name: Build web bundle
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build:web

      - name: Sync web bundle into the Android project
        working-directory: apps/web
        run: npx cap sync android

      # Capacitor 7 compiles against Java 21 (apps/web/android/app/capacitor.build.gradle).
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # Gradle resolves ':capacitor-android' relative to the process working
      # directory, so it has to run from inside the Android project.
      # Retried because Maven Central still answers CI runners with HTTP 429
      # often enough to fail an otherwise healthy build.
      - name: Build debug APK
        working-directory: apps/web/android
        run: |
          chmod +x gradlew
          for attempt in 1 2 3; do
            if ./gradlew assembleDebug --no-daemon; then
              exit 0
            fi
            echo "::warning::Gradle attempt $attempt failed; retrying"
            sleep $((attempt * 30))
          done
          exit 1

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: clipmine-debug-apk
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
