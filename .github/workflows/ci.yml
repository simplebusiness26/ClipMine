name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  web-and-docs:
    name: Web and documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Lint documentation
        run: npm run lint:docs

      - name: Check documentation links
        run: npm run check:links

      - name: Type-check web app
        run: npm run lint:web

      - name: Test web app
        run: npm run test:web

      - name: Build web app
        run: npm run build:web

  api:
    name: API and media pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements-dev.txt

      - name: Install Python dependencies
        run: python -m pip install -r services/api/requirements-dev.txt

      - name: Install and verify speech runtime
        run: |
          python -m pip install -r services/api/requirements-ai.txt
          python -c "from faster_whisper import WhisperModel; import ctranslate2; assert ctranslate2.__version__ == '4.6.3'"

      - name: Lint API
        run: ruff check services/api/clipmine_api services/api/tests

      - name: Test API and media pipeline
        working-directory: services/api
        run: pytest -q

  niches:
    name: Niches tenant isolation and mobile journey
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - run: python -m pip install -r services/api/requirements-dev.txt
      - run: node ops/niches-bridge/clipmine-journey.mjs
      - run: npm run check:niches
      - run: npm run test:edge && node --test ops/niches-bridge/config.test.mjs
      - run: npm run build:web
      - run: npx playwright install --with-deps chromium
      - name: Start disposable local application
        run: |
          node ops/niches-bridge/local-test-server.mjs > /tmp/niches-local.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/api/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/niches-local.log
          exit 1
      - run: npm run test:browser
        env:
          NICHES_URL: http://127.0.0.1:8787
          NICHES_TEST_WRITE: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: niches-browser-evidence
          path: test-results/
